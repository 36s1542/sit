<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sit-down 출석부</title>

    <!-- TensorFlow.js 및 Teachable Machine 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        :root {
            --bg-color: #2f3e30;
            --book-cover: #1d281f;
            --paper-bg: #fdfbf7;
            --line-color: #e2dcd2;
            --text-color: #2d3748;
            --primary-color: #3b5a45;
            --accent-color: #c53030;
            --border-color: #cbd5e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 3D 책 및 출석부 커버 프레임 */
        .book-wrapper {
            width: 100%;
            max-width: 450px;
            height: 640px;
            perspective: 1200px;
            position: relative;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* 책 장 개별 스타일 */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: var(--paper-bg);
            /* 출석부 줄무늬 및 바인더 디자인 */
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 32px;
            border-radius: 6px 16px 16px 6px;
            border-left: 14px solid #1a1a1a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset -5px 0 10px rgba(0,0,0,0.05);
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            
            /* 책 넘어가는 transition 처리 */
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            backface-visibility: hidden;
            z-index: 1;
        }

        /* 책 장이 왼쪽으로 완전히 넘어간 상태 */
        .page.flipped {
            transform: rotateY(-180deg);
            pointer-events: none;
            opacity: 0;
        }

        /* 페이지 헤더 */
        .page-header {
            text-align: center;
            border-bottom: 2px double var(--primary-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
            background-color: rgba(253, 251, 247, 0.9);
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .page-step {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 4px;
        }

        /* 페이지 본문 */
        .page-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            background-color: rgba(253, 251, 247, 0.85);
            padding: 10px;
            border-radius: 8px;
        }

        /* 1장: 입력 필드 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--primary-color);
        }

        .input-group input {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background-color: #fff;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* 2장: 자습 공간 선택 버튼 */
        .location-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            padding: 16px 10px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background-color: #fff;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn.selected {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* 3장: 시간 스크롤 (Slider) */
        .time-slider-wrapper {
            text-align: center;
            padding: 10px 0;
        }

        .time-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 16px;
        }

        .slider {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #e2e8f0;
            outline: none;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #718096;
            margin-top: 8px;
        }

        /* 4장: 티처블 머신 연동 영역 */
        .summary-box {
            background-color: #edf2f7;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            border-left: 4px solid var(--primary-color);
        }

        .input-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
        }

        .toggle-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .media-box {
            width: 100%;
            height: 180px;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .media-box canvas, .media-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .media-placeholder {
            color: #a0aec0;
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
        }

        .action-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        .file-label {
            display: block;
            text-align: center;
            background-color: #319795;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        /* 예측 결과 라이브 바 */
        .result-section {
            margin-top: 8px;
        }

        .top-result {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .bar-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bar-item {
            font-size: 0.75rem;
        }

        .bar-labels {
            display: flex;
            justify-content: space-between;
        }

        .bar-bg {
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.2s ease;
        }

        /* 하단 네비게이션 버튼 */
        .page-footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            background-color: rgba(253, 251, 247, 0.9);
            padding-top: 8px;
        }

        .nav-btn {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            min-height: 48px;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-prev {
            background-color: #cbd5e0;
            color: var(--text-color);
        }

        .hidden { display: none !important; }
        .error-msg { color: var(--accent-color); font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

<div class="book-wrapper">
    <div class="book">

        <!-- [장 1] 학번 및 이름 입력 -->
        <div class="page" id="page1" style="z-index: 4;">
            <div class="page-header">
                <div class="page-title">📋 출석부 서명</div>
                <div class="page-step">1 / 4 단계</div>
            </div>
            <div class="page-body">
                <div class="input-group">
                    <label for="studentId">학번</label>
                    <input type="text" id="studentId" placeholder="예: 20924">
                </div>
                <div class="input-group">
                    <label for="studentName">이름</label>
                    <input type="text" id="studentName" placeholder="예: 홍길동">
                </div>
            </div>
            <div class="page-footer">
                <button class="nav-btn btn-next" onclick="goToNextPage(1)">다음 페이지로 ➔</button>
            </div>
        </div>

        <!-- [장 2] 자습 공간 선택 -->
        <div class="page" id="page2" style="z-index: 3;">
            <div class="page-header">
                <div class="page-title">🏫 자습 공간 선택</div>
                <div class="page-step">2 / 4 단계</div>
            </div>
            <div class="page-body">
                <p style="text-align: center; font-weight: bold;">자습할 공간을 선택하세요.</p>
                <div class="location-grid">
                    <button class="option-btn" onclick="selectLocation(this, '스카')">스카</button>
                    <button class="option-btn" onclick="selectLocation(this, '학교 야자실')">학교 야자실</button>
                    <button class="option-btn" onclick="selectLocation(this, '학교 도서관')">학교 도서관</button>
                    <button class="option-btn" onclick="selectLocation(this, '교실')">교실</button>
                </div>
            </div>
            <div class="page-footer">
                <button class="nav-btn btn-prev" onclick="goToPrevPage(2)">이전</button>
                <button class="nav-btn btn-next" onclick="goToNextPage(2)">다음 페이지로 ➔</button>
            </div>
        </div>

        <!-- [장 3] 공부 시간 선택 (스크롤) -->
        <div class="page" id="page3" style="z-index: 2;">
            <div class="page-header">
                <div class="page-title">⏱️ 공부 시간 설정</div>
                <div class="page-step">3 / 4 단계</div>
            </div>
            <div class="page-body">
                <p style="text-align: center; font-weight: bold;">공부할 시간을 스크롤로 선택하세요.</p>
                <div class="time-slider-wrapper">
                    <div class="time-display" id="timeDisplay">0시간</div>
                    <input type="range" id="timeSlider" class="slider" min="0" max="12" step="1" value="0" oninput="updateTimeValue(this.value)">
                    <div class="slider-labels">
                        <span>0시간</span>
                        <span>6시간</span>
                        <span>12시간</span>
                    </div>
                </div>
            </div>
            <div class="page-footer">
                <button class="nav-btn btn-prev" onclick="goToPrevPage(3)">이전</button>
                <button class="nav-btn btn-next" onclick="goToNextPage(3)">다음 페이지로 ➔</button>
            </div>
        </div>

        <!-- [장 4] 티처블 머신 자리 판별 -->
        <div class="page" id="page4" style="z-index: 1;">
            <div class="page-header">
                <div class="page-title">🔍 자리 유무 판별</div>
                <div class="page-step">4 / 4 단계</div>
            </div>
            <div class="page-body">
                <!-- 선택 내역 요약 -->
                <div class="summary-box" id="summaryBox">
                    정보를 확인 중입니다...
                </div>

                <!-- 카메라 / 파일업로드 방식 선택 -->
                <div class="input-toggle">
                    <button id="camToggleBtn" class="toggle-btn active" onclick="switchMediaMode('webcam')">카메라</button>
                    <button id="fileToggleBtn" class="toggle-btn" onclick="switchMediaMode('file')">사진 업로드</button>
                </div>

                <!-- 미디어 출력 영역 -->
                <div class="media-box">
                    <div id="mediaPlaceholder" class="media-placeholder">입력 장치를 시작하거나 사진을 올려주세요.</div>
                    <div id="webcamContainer"></div>
                    <img id="imagePreview" class="hidden" alt="업로드 이미지">
                </div>

                <!-- 카메라 및 파일 컨트롤 -->
                <div id="camControls">
                    <button id="startCamBtn" class="action-btn" onclick="startWebcam()">카메라 시작</button>
                    <button id="stopCamBtn" class="action-btn hidden" style="background-color:#e53e3e;" onclick="stopWebcam()">카메라 중지</button>
                </div>
                <div id="fileControls" class="hidden">
                    <label for="imageUpload" class="file-label">사진 선택하기</label>
                    <input type="file" id="imageUpload" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
                </div>

                <div id="errorText" class="error-msg hidden"></div>

                <!-- 예측 결과 표시 -->
                <div class="result-section">
                    <div class="top-result">결과: <span id="topResultLabel">-</span></div>
                    <div id="barContainer" class="bar-container"></div>
                </div>
            </div>
            <div class="page-footer">
                <button class="nav-btn btn-prev" onclick="goToPrevPage(4)">이전</button>
            </div>
        </div>

    </div>
</div>

<script>
    // 상태 파라미터
    let selectedLocation = '';
    let selectedHours = 0;
    
    // 티처블 머신 연동 URL
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/5T_6kHd9-/";
    let model, webcam, maxPredictions;
    let isWebcamRunning = false;
    let currentMediaMode = 'webcam';
    let currentObjectUrl = null;

    // 초기 로딩 시 모델 사전 로드
    window.addEventListener('DOMContentLoaded', loadModel);

    async function loadModel() {
        try {
            const modelURL = MODEL_URL + "model.json";
            const metadataURL = MODEL_URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            buildResultBars();
        } catch (e) {
            showError("모델을 불러올 수 없습니다. 인터넷 상태를 확인해 주세요.");
        }
    }

    // 막대 그래프 생성
    function buildResultBars() {
        const container = document.getElementById("barContainer");
        container.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            const label = model.getClassLabels()[i];
            const item = document.createElement("div");
            item.className = "bar-item";
            item.innerHTML = `
                <div class="bar-labels">
                    <span>${label}</span>
                    <span id="percent-${i}">0%</span>
                </div>
                <div class="bar-bg">
                    <div id="bar-fill-${i}" class="bar-fill"></div>
                </div>
            `;
            container.appendChild(item);
        }
    }

    // 페이지 이동 (책장 넘김 효과)
    function goToNextPage(pageNum) {
        // 유효성 검사
        if (pageNum === 1) {
            const id = document.getElementById('studentId').value.trim();
            const name = document.getElementById('studentName').value.trim();
            if (!id || !name) {
                alert("학번과 이름을 모두 입력해 주세요.");
                return;
            }
        } else if (pageNum === 2) {
            if (!selectedLocation) {
                alert("자습할 공간을 선택해 주세요.");
                return;
            }
        }

        // 페이지 넘기기 애니메이션 적용
        const targetPage = document.getElementById(`page${pageNum}`);
        targetPage.classList.add('flipped');

        // 4번째 장 도달 시 요약 갱신
        if (pageNum === 3) {
            updateSummary();
        }
    }

    function goToPrevPage(pageNum) {
        const prevPageNum = pageNum - 1;
        const targetPage = document.getElementById(`page${prevPageNum}`);
        targetPage.classList.remove('flipped');

        if (pageNum === 4) {
            stopWebcam();
        }
    }

    // 장소 선택 (2장)
    function selectLocation(btnElement, locName) {
        const allBtns = document.querySelectorAll('.location-grid .option-btn');
        allBtns.forEach(btn => btn.classList.remove('selected'));
        btnElement.classList.add('selected');
        selectedLocation = locName;
    }

    // 공부 시간 슬라이더 (3장)
    function updateTimeValue(val) {
        selectedHours = val;
        document.getElementById('timeDisplay').innerText = `${val}시간`;
    }

    // 4장 요약 업데이트
    function updateSummary() {
        const id = document.getElementById('studentId').value.trim();
        const name = document.getElementById('studentName').value.trim();
        document.getElementById('summaryBox').innerHTML = `
            <strong>${id} ${name}</strong> 학생<br>
            • 공간: <strong>${selectedLocation}</strong> | • 시간: <strong>${selectedHours}시간</strong>
        `;
    }

    // 입력 모드 변경 (카메라 <-> 사진 파일)
    function switchMediaMode(mode) {
        if (currentMediaMode === mode) return;
        currentMediaMode = mode;
        hideError();

        document.getElementById('camToggleBtn').classList.toggle('active', mode === 'webcam');
        document.getElementById('fileToggleBtn').classList.toggle('active', mode === 'file');

        document.getElementById('camControls').classList.toggle('hidden', mode !== 'webcam');
        document.getElementById('fileControls').classList.toggle('hidden', mode !== 'file');

        if (mode === 'file') {
            stopWebcam();
            clearFilePreview();
        } else {
            clearFilePreview();
        }
        resetMediaUI();
    }

    // 카메라 실행
    async function startWebcam() {
        if (isWebcamRunning) return;
        hideError();

        try {
            webcam = new tmImage.Webcam(200, 200, true);
            await webcam.setup();
            await webcam.play();

            isWebcamRunning = true;
            window.requestAnimationFrame(webcamLoop);

            const container = document.getElementById("webcamContainer");
            container.innerHTML = "";
            container.appendChild(webcam.canvas);

            document.getElementById("mediaPlaceholder").classList.add("hidden");
            document.getElementById("startCamBtn").classList.add("hidden");
            document.getElementById("stopCamBtn").classList.remove("hidden");
        } catch (e) {
            showError("카메라를 켤 수 없습니다. 권한을 확인해주세요.");
        }
    }

    async function webcamLoop() {
        if (isWebcamRunning) {
            webcam.update();
            await predictImage(webcam.canvas);
            window.requestAnimationFrame(webcamLoop);
        }
    }

    function stopWebcam() {
        if (webcam && isWebcamRunning) {
            webcam.stop();
            isWebcamRunning = false;
        }
        document.getElementById("startCamBtn").classList.remove("hidden");
        document.getElementById("stopCamBtn").classList.add("hidden");
    }

    // 파일 업로드 분류
    async function handleFileUpload(e) {
        hideError();
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            showError("이미지 파일만 올려주세요.");
            return;
        }

        clearFilePreview();

        const imgEl = document.getElementById('imagePreview');
        currentObjectUrl = URL.createObjectURL(file);
        imgEl.src = currentObjectUrl;
        imgEl.classList.remove('hidden');
        document.getElementById('mediaPlaceholder').classList.add('hidden');

        imgEl.onload = async function() {
            await predictImage(imgEl);
        };
    }

    function clearFilePreview() {
        if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = null;
        }
        const imgEl = document.getElementById('imagePreview');
        imgEl.src = "";
        imgEl.classList.add('hidden');
    }

    // 예측 실행 공통 함수
    async function predictImage(element) {
        if (!model) return;
        try {
            const predictions = await model.predict(element);
            let topProb = -1;
            let topLabel = "-";

            for (let i = 0; i < maxPredictions; i++) {
                const prob = predictions[i].probability;
                const percent = (prob * 100).toFixed(0);

                document.getElementById(`percent-${i}`).innerText = percent + "%";
                document.getElementById(`bar-fill-${i}`).style.width = percent + "%";

                if (prob > topProb) {
                    topProb = prob;
                    topLabel = predictions[i].className;
                }
            }

            document.getElementById("topResultLabel").innerText = topLabel;
        } catch (e) {
            showError("판별 중 오류가 발생했습니다.");
        }
    }

    function resetMediaUI() {
        document.getElementById("mediaPlaceholder").classList.remove("hidden");
        document.getElementById("webcamContainer").innerHTML = "";
        document.getElementById("topResultLabel").innerText = "-";
        for (let i = 0; i < maxPredictions; i++) {
            const bar = document.getElementById(`bar-fill-${i}`);
            const text = document.getElementById(`percent-${i}`);
            if (bar) bar.style.width = "0%";
            if (text) text.innerText = "0%";
        }
    }

    function showError(msg) {
        const el = document.getElementById('errorText');
        el.innerText = msg;
        el.classList.remove('hidden');
    }

    function hideError() {
        document.getElementById('errorText').classList.add('hidden');
    }
</script>
